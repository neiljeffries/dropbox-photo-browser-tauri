[target.x86_64-pc-windows-msvc]
# Resolve the MSVC linker from the active developer environment instead of
# hardcoding a machine- and version-specific Visual Studio installation path.
linker = "link.exe"

[env]
# Resolve the compiler and archiver from the active MSVC environment.
# Build from a Visual Studio Developer Command Prompt (or equivalent CI setup)
# so LIB, INCLUDE, and PATH are initialized correctly for the installed toolchain.
CC = { value = "cl.exe", force = true }
AR = { value = "lib.exe", force = true }
